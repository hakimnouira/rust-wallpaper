<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RustWallpaper Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: #f1f5f9;
      background-color: #0b0f19;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 20px;
      height: 20px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .health-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .health-dot.online {
      background: #34d399;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
    }
    .health-dot.offline {
      background: #f87171;
      box-shadow: 0 0 6px rgba(248, 113, 113, 0.5);
    }
    .health-text {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
    }
    .health-text.online {
      color: #94a3b8;
    }
    .health-text.offline {
      color: #f87171;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #151c2e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    select:focus, input[type="text"]:focus {
      border-color: #6366f1;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-secondary:hover {
      background: #283548;
      color: #ffffff;
    }
    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .msg-feedback {
      margin-top: 8px;
      font-size: 11px;
      min-height: 16px;
      text-align: center;
      font-weight: 500;
    }
    .msg-feedback.success { color: #34d399; }
    .msg-feedback.error { color: #f87171; }
    .history-container {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
    .history-list {
      list-style: none;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
    }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
    }
    .history-item:hover {
      background: #1e293b;
      color: #e2e8f0;
    }
    .history-url {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 230px;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-48.png" alt="RustWallpaper">
      <span class="brand-title">RustWallpaper</span>
    </div>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="health-bar">
    <span id="healthDot" class="health-dot offline"></span>
    <span id="healthText" class="health-text offline">Checking connection...</span>
  </div>

  <div class="form-group">
    <div class="section-title">Target Display</div>
    <select id="monitorSelect">
      <option value="all">All Monitors (Synchronized)</option>
    </select>
  </div>

  <div class="form-group">
    <div class="section-title">Quick Apply URL</div>
    <input type="text" id="urlInput" placeholder="Paste video or image URL (mp4, webm, gif, png)">
    <div style="margin-top: 6px;">
      <button id="applyBtn" class="btn btn-primary">Apply as Desktop Wallpaper</button>
    </div>
    <div id="feedback" class="msg-feedback"></div>
  </div>

  <div class="section-title">Quick Controls</div>
  <div class="controls-row">
    <button id="pauseBtn" class="btn btn-secondary">⏸ Pause</button>
    <button id="resumeBtn" class="btn btn-secondary">▶ Resume</button>
  </div>

  <div class="history-container">
    <div class="section-title">Recent Web Wallpapers</div>
    <ul id="historyList" class="history-list">
      <li class="history-item" style="cursor: default; color: #475569;">No recent wallpapers</li>
    </ul>
  </div>

  <div class="footer">
    Desktop Engine Loopback Bridge: 127.0.0.1:24242
  </div>

  <script src="popup.js"></script>
</body>
</html>
